name: ServiceDesk CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: servicedesk_ci
          POSTGRES_PASSWORD: ci_ephemeral_password
          POSTGRES_DB: servicedesk_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U servicedesk_ci -d servicedesk_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://servicedesk_ci:ci_ephemeral_password@127.0.0.1:5432/servicedesk_ci?schema=public
      TEST_DATABASE_URL: postgresql://servicedesk_ci:ci_ephemeral_password@127.0.0.1:5432/servicedesk_ci?schema=public
      AUTH_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Generate an ephemeral session secret
        run: node -e "require('node:fs').appendFileSync(process.env.GITHUB_ENV, 'AUTH_SECRET=' + require('node:crypto').randomBytes(48).toString('base64url') + '\n')"
      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:migrate
      - run: npm test
      - run: npm run build
      - run: npm run test:integration
